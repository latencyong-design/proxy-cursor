name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows script validation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate PowerShell syntax
        shell: pwsh
        run: ./tests/Validate-PowerShellSyntax.ps1
